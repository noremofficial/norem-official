<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NOREM — パスワード再設定</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Lato:wght@300;400&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato','Hiragino Sans',sans-serif;background:#f7f7f5;color:#2a2a2a;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{background:#fff;padding:48px 40px;width:100%;max-width:400px;margin:20px}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.3rem;letter-spacing:0.24em;text-align:center;margin-bottom:32px}
.logo a{color:#0d0d0d;text-decoration:none}
h2{font-size:0.65rem;letter-spacing:0.2em;text-transform:uppercase;color:#9a9690;margin-bottom:20px;text-align:center}
.field{margin-bottom:16px}
.field label{display:block;font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;color:#9a9690;margin-bottom:5px}
.field input{width:100%;padding:10px 12px;border:1px solid #e4e0da;font-size:0.82rem;font-family:inherit;color:#0d0d0d;outline:none}
.field input:focus{border-color:#0d0d0d}
.btn{width:100%;padding:14px;background:#0d0d0d;color:#fff;border:none;font-size:0.72rem;letter-spacing:0.18em;text-transform:uppercase;cursor:pointer;margin-top:8px}
.msg{font-size:0.75rem;text-align:center;margin-top:14px;line-height:1.7}
.msg.error{color:#c0392b}
.msg.ok{color:#27ae60}
.back{display:block;text-align:center;font-size:0.62rem;color:#9a9690;text-decoration:none;margin-top:20px;letter-spacing:0.1em}
.back:hover{color:#0d0d0d}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><a href="index.html">NOREM</a></div>

  <!-- メール送信フォーム -->
  <div id="requestView">
    <h2>パスワード再設定</h2>
    <div class="field">
      <label>登録メールアドレス</label>
      <input type="email" id="resetEmail" placeholder="sample@example.com"/>
    </div>
    <button class="btn" onclick="sendResetEmail()">再設定メールを送る</button>
    <div class="msg" id="requestMsg"></div>
    <a href="cart.html" class="back">← ログインに戻る</a>
  </div>

  <!-- 新パスワード設定フォーム -->
  <div id="updateView" style="display:none">
    <h2>新しいパスワードを設定</h2>
    <div class="field">
      <label>新しいパスワード（8文字以上）</label>
      <input type="password" id="newPassword" placeholder="••••••••"/>
    </div>
    <div class="field">
      <label>パスワード確認</label>
      <input type="password" id="newPassword2" placeholder="••••••••"/>
    </div>
    <button class="btn" onclick="updatePassword()">パスワードを更新</button>
    <div class="msg" id="updateMsg"></div>
  </div>
</div>

<script>
// URLにアクセストークンが含まれている場合は新パスワード設定画面を表示
window.addEventListener('load', async () => {
  const hash = window.location.hash;
  if (hash.includes('type=recovery') || hash.includes('access_token')) {
    document.getElementById('requestView').style.display = 'none';
    document.getElementById('updateView').style.display = 'block';
    // Supabase がハッシュを自動処理
    const sb = getSupabase();
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      // ハッシュから手動でセッションを取得
      await sb.auth.exchangeCodeForSession(hash.replace('#', ''));
    }
  }
});

async function sendResetEmail() {
  const email = document.getElementById('resetEmail').value.trim();
  const msgEl = document.getElementById('requestMsg');
  if (!email) { msgEl.className='msg error'; msgEl.textContent='メールアドレスを入力してください'; return; }

  const sb = getSupabase();
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/reset-password.html',
  });

  if (error) {
    msgEl.className = 'msg error';
    msgEl.textContent = 'エラー: ' + error.message;
    console.error('reset error:', error);
  } else {
    msgEl.className = 'msg ok';
    msgEl.textContent = '再設定メールを送信しました。メールをご確認ください。';
    document.getElementById('resetEmail').value = '';
  }
}

async function updatePassword() {
  const pw  = document.getElementById('newPassword').value;
  const pw2 = document.getElementById('newPassword2').value;
  const msgEl = document.getElementById('updateMsg');

  if (pw.length < 8) { msgEl.className='msg error'; msgEl.textContent='8文字以上で入力してください'; return; }
  if (pw !== pw2)    { msgEl.className='msg error'; msgEl.textContent='パスワードが一致しません'; return; }

  const sb = getSupabase();
  const { error } = await sb.auth.updateUser({ password: pw });

  if (error) {
    msgEl.className = 'msg error';
    msgEl.textContent = 'エラーが発生しました。リンクの有効期限が切れている可能性があります。';
  } else {
    msgEl.className = 'msg ok';
    msgEl.textContent = 'パスワードを更新しました。';
    setTimeout(() => window.location.href = 'cart.html', 2000);
  }
}
</script>
  <script src="cookie-consent.js"></script>
</body>
</html>

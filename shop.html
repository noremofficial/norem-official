<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOREM — Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #878787;
      --white: #ffffff;
      --off-white: #fafaf8;
      --mid: #9a9690;
      --border: #e4e0da;
      --light: #f4f2ee;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Lato', 'Hiragino Sans', sans-serif;
      background: var(--white);
      color: #878787;
      overflow-x: hidden;
    }

    /* ========== NAV ========== */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 144px;
      height: 60px;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      border-bottom: 1px solid transparent;
      transition: background 0.8s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    nav.nav-hidden {
      transform: translateY(-100%);
    }

    nav.scrolled {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .nav-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 400;
      letter-spacing: 0.24em;
      color: #878787;
      text-decoration: none;
      transition: color 0.8s ease;
    }

    nav.scrolled .nav-logo { color: var(--black); }

    .nav-logo-img {
      height: 36px;
      width: auto;
      object-fit: contain;
      filter: brightness(0) invert(1) brightness(0.337);
      transition: filter 0.8s ease;
    }

    nav.scrolled .nav-logo-img { filter: brightness(0) invert(1) brightness(0.337); }

    .nav-links {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.67rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #878787;
      text-decoration: none;
      transition: color 0.8s ease;
    }

    nav.scrolled .nav-links a { color: var(--black); }

    .nav-links a:hover { opacity: 0.6; }

    /* Collection / Shop オーバーレイ */
    .nav-label { font-size: 0.67rem; letter-spacing: 0.18em; text-transform: uppercase; color: inherit; cursor: pointer; }

    .coll-overlay {
      position: fixed;
      top: 0;
      left: 0; right: 0;
      height: auto;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      z-index: 90;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 88px 0 140px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      -webkit-mask-image: linear-gradient(to bottom, black calc(100% - 110px), transparent 100%);
      mask-image: linear-gradient(to bottom, black calc(100% - 110px), transparent 100%);
    }

    nav.overlay-open {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border-color: transparent !important;
      transition: background 0.2s, border-color 0.2s, transform 0.35s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    .coll-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .coll-overlay-inner {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 72px;
      text-align: center;
    }

    .nav-overlay-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1em;
    }

    @keyframes navItemIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .nav-overlay-heading {
      font-size: 0.54rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #878787;
      padding-bottom: 0.8em;
      border-bottom: 1px solid var(--border);
      width: 100%;
      opacity: 0;
    }

    .coll-overlay.open .nav-overlay-heading {
      animation: navItemIn 0.3s cubic-bezier(0.16,1,0.3,1) both;
    }

    .nav-overlay-sub {
      font-size: clamp(0.52rem, 0.76vw, 0.6rem) !important;
      letter-spacing: 0.2em !important;
      color: #a0a0a0 !important;
    }

    .coll-overlay-inner a {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(0.62rem, 0.9vw, 0.72rem);
      font-weight: 300;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #878787;
      text-decoration: none;
      opacity: 0;
      transition: color 0.2s;
    }

    .coll-overlay.open .coll-overlay-inner a {
      animation: navItemIn 0.3s cubic-bezier(0.16,1,0.3,1) both;
    }

    .coll-overlay-inner a:hover { color: #888888; }

    .nav-right { display: flex; align-items: center; gap: 18px; }

    .nav-icon {
      background: none;
      border: none;
      cursor: pointer;
      color: #878787;
      display: flex;
      transition: color 0.8s ease;
    }

    nav.scrolled .nav-icon { color: var(--black); }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
    }

    .hamburger span {
      display: block;
      width: 22px;
      height: 1px;
      background: #878787;
      transition: transform 0.3s, opacity 0.3s, background 0.8s ease;
    }

    nav.scrolled .hamburger span { background: var(--black); }
    .hamburger.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

    .mobile-menu {
      display: none;
      position: fixed;
      inset: 60px 0 0;
      background: var(--white);
      z-index: 99;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
    }

    .mobile-menu.open { display: flex; }

    .mobile-menu a {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      color: var(--black);
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .mobile-coll-wrap { width: 100%; text-align: center; }
    .mobile-coll-toggle { display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; background: none; border: none; font-family: inherit; font-size: 1.1rem; font-weight: 300; letter-spacing: 0.12em; color: var(--black); text-decoration: none; width: 100%; -webkit-tap-highlight-color: transparent; }
    .mobile-coll-arrow { font-size: 0.7rem; color: var(--mid); transition: transform 0.25s; }
    .mobile-coll-arrow.open { transform: rotate(180deg); }
    .mobile-coll-seasons { display: flex; flex-direction: column; gap: 14px; margin-top: 0; max-height: 0; overflow: hidden; opacity: 0; transition: max-height 0.35s ease, opacity 0.3s ease, margin-top 0.3s ease; }
    .mobile-coll-seasons.open { max-height: 300px; opacity: 1; margin-top: 14px; }
    .mobile-coll-seasons a { font-size: 0.78rem !important; letter-spacing: 0.14em; color: var(--mid) !important; }
    .mobile-shop-wrap { width: 100%; text-align: center; }
    .mobile-shop-toggle { display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; background: none; border: none; font-family: inherit; font-size: 1.1rem; font-weight: 300; letter-spacing: 0.12em; color: var(--black); text-decoration: none; width: 100%; -webkit-tap-highlight-color: transparent; }
    .mobile-shop-arrow { font-size: 0.7rem; color: var(--mid); transition: transform 0.25s; }
    .mobile-shop-arrow.open { transform: rotate(180deg); }
    .mobile-shop-items { display: flex; flex-direction: column; gap: 14px; margin-top: 0; max-height: 0; overflow: hidden; opacity: 0; transition: max-height 0.35s ease, opacity 0.3s ease, margin-top 0.3s ease; }
    .mobile-shop-items.open { max-height: 500px; opacity: 1; margin-top: 14px; }
    .mobile-shop-items a { font-size: 0.78rem !important; letter-spacing: 0.14em; color: var(--mid) !important; }
    .mobile-shop-items .shop-section-head { font-size: 0.65rem !important; letter-spacing: 0.18em; color: #aaa !important; text-transform: uppercase; margin-top: 6px; pointer-events: none; }

    /* ========== PAGE HEADER ========== */
    .page-header {
      padding: 0;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
    }

    .breadcrumb a {
      color: var(--mid);
      text-decoration: none;
      transition: color 0.2s;
    }

    .breadcrumb a:hover { color: var(--black); }

    .breadcrumb .bc-sep { color: var(--border); }
    .breadcrumb .bc-current { color: var(--black); }

    /* ========== MAIN LAYOUT ========== */
    .shop-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: calc(100vh - 56px - 97px);
    }

    /* ========== FILTER SIDEBAR ========== */
    .filter-sidebar {
      border-right: 1px solid var(--border);
      padding: 32px 24px;
      position: sticky;
      top: 56px;
      height: calc(100vh - 56px);
      overflow-y: auto;
    }

    .filter-sidebar::-webkit-scrollbar { width: 3px; }
    .filter-sidebar::-webkit-scrollbar-thumb { background: var(--border); }

    .filter-heading {
      font-size: 0.6rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--black);
      margin-bottom: 24px;
      font-weight: 700;
    }

    /* アコーディオン */
    .filter-group {
      border-top: 1px solid var(--border);
    }

    .filter-group:last-child { border-bottom: 1px solid var(--border); }

    .filter-group-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--black);
      text-align: left;
    }

    .filter-group-btn .fg-arrow {
      transition: transform 0.25s;
      color: var(--mid);
      flex-shrink: 0;
    }

    .filter-group-btn.open .fg-arrow { transform: rotate(180deg); }

    .filter-content {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.3s ease, padding 0.3s ease;
    }

    .filter-content.open {
      max-height: 400px;
      padding-bottom: 16px;
    }

    /* 価格フィルター */
    .price-range {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .price-range span { font-size: 0.7rem; color: var(--mid); white-space: nowrap; }

    .price-input {
      width: 72px;
      padding: 5px 8px;
      border: 1px solid var(--border);
      font-size: 0.72rem;
      color: var(--black);
      font-family: 'Lato', sans-serif;
      background: var(--white);
      outline: none;
      transition: border-color 0.2s;
    }

    .price-input:focus { border-color: var(--black); }

    /* 出品状況 */
    .status-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .status-selected {
      font-size: 0.65rem;
      color: var(--mid);
    }

    .cb-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .cb-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      color: var(--black);
      cursor: pointer;
    }

    .cb-label input[type="checkbox"] {
      width: 14px;
      height: 14px;
      border: 1px solid var(--border);
      appearance: none;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: border-color 0.2s;
    }

    .cb-label input[type="checkbox"]:checked {
      background: var(--black);
      border-color: var(--black);
    }

    .cb-label input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 2px; top: 5px;
      width: 8px; height: 4px;
      border-left: 1.5px solid var(--white);
      border-bottom: 1.5px solid var(--white);
      transform: rotate(-45deg);
    }

    /* 並び替え */
    .sort-list {
      list-style: none;
      display: flex;
      flex-direction: column;
    }

    .sort-list li {
      padding: 8px 0;
      font-size: 0.72rem;
      color: var(--mid);
      cursor: pointer;
      transition: color 0.2s;
      border-bottom: 1px solid transparent;
    }

    .sort-list li:hover { color: var(--black); }
    .sort-list li.active { color: var(--black); font-weight: 700; }

    /* リセットボタン */
    .reset-btn {
      background: none;
      border: none;
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      color: var(--mid);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      padding: 0;
      transition: color 0.2s;
    }

    .reset-btn:hover { color: var(--black); }

    /* ========== FILTER BAR ========== */
    .product-area {
      padding: 0 clamp(48px, 23.5vw, 339px) 360px;
      background: var(--white);
    }

    .season-banner {
      width: calc(100% + clamp(48px, 23.5vw, 339px) * 2);
      margin-left: calc(-1 * clamp(48px, 23.5vw, 339px));
      height: 0;
      background-size: cover;
      background-position: center;
      overflow: hidden;
      margin-bottom: 0;
    }

    .season-banner.visible {
      height: 100vh;
      margin-bottom: 220px;
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 24px 0;
      margin-bottom: 60px;
      flex-wrap: wrap;
    }

    .filter-bar-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .total-count {
      font-size: 0.67rem;
      letter-spacing: 0.1em;
      color: var(--mid);
      white-space: nowrap;
    }

    /* ドロップダウンボタン */
    .fd-wrap { position: relative; }

    .fd-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      background: var(--white);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--black);
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.2s;
      font-family: 'Lato', sans-serif;
    }

    .fd-btn:hover { border-color: var(--black); }
    .fd-btn.active { background: var(--black); color: var(--white); border-color: var(--black); }

    .fd-arrow { transition: transform 0.25s; color: var(--mid); }
    .fd-btn.open .fd-arrow { transform: rotate(180deg); }
    .fd-btn.active .fd-arrow { color: rgba(255,255,255,0.6); }

    .fd-panel {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      background: var(--white);
      border: 1px solid var(--border);
      padding: 18px;
      min-width: 220px;
      z-index: 200;
      box-shadow: 0 6px 28px rgba(0,0,0,0.07);
      display: none;
    }

    .fd-panel.open { display: block; }

    /* 並び替えセレクト */
    .sort-select {
      border: none;
      border-bottom: 1px solid var(--border);
      padding: 4px 0;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--black);
      background: transparent;
      cursor: pointer;
      outline: none;
      font-family: 'Lato', sans-serif;
    }

    /* 4列グリッド */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      column-gap: 5px;
      row-gap: 70px;
    }

    .product-card { cursor: pointer; text-align: center; }

    .product-img {
      width: 100%;
      aspect-ratio: 2/3;
      position: relative;
      margin-bottom: 10px;
      overflow: hidden;
      background-size: cover !important;
      background-position: center !important;
    }

    .product-img.p1  { background: #d8d8d8; }
    .product-img.p2  { background: #e2e2e2; }
    .product-img.p3  { background: #cccccc; }
    .product-img.p4  { background: #dcdcdc; }
    .product-img.p5  { background: #d0d0d0; }
    .product-img.p6  { background: #e6e6e6; }
    .product-img.p7  { background: #c8c8c8; }
    .product-img.p8  { background: #dadada; }
    .product-img.p9  { background: #e0e0e0; }
    .product-img.p10 { background: #d4d4d4; }
    .product-img.p11 { background: #cfcfcf; }
    .product-img.p12 { background: #e8e8e8; }

    .product-img-hover {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform, opacity;
      z-index: 1;
    }

    .product-card:hover .product-img-hover {
      opacity: 1;
      transform: translateY(0);
    }

    .product-img-overlay {
      position: absolute;
      inset: 0;
      background: rgba(13,13,13,0);
      transition: background 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .product-card:hover .product-img-overlay { background: rgba(13,13,13,0.16); }

    .product-img-btn {
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.6);
      padding: 7px 16px;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
    }

    .product-card:hover .product-img-btn { opacity: 1; transform: translateY(0); }

    /* 左上バッジ（別注・Coming Soon）*/
    .corner-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 3;
      font-size: 0.55rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 3px 8px;
      color: var(--white);
    }
    .badge-bespoke-tag { background: rgba(180,148,110,0.88); }     /* ベージュ */
    .badge-comingsoon-tag { background: rgba(100,100,100,0.78); } /* グレー */

    /* Sold Out：中央オーバーレイ */
    .soldout-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
    }
    .soldout-badge {
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(13,13,13,0.7);
      border: 1px solid rgba(13,13,13,0.3);
      padding: 5px 14px;
      background: rgba(255,255,255,0.6);
    }

    .product-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.825rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      margin-bottom: 3px;
      text-align: center;
      color: #bababa;
    }

    .product-price {
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      color: var(--mid);
      text-align: center;
      opacity: 0;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .product-card:hover .product-price { opacity: 1; }

    .product-card.soldout .product-name,
    .product-card.soldout .product-price { opacity: 0.5; }

    /* 0件メッセージ */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 0;
      font-size: 0.85rem;
      color: var(--mid);
      letter-spacing: 0.1em;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 48px 0 64px;
    }

    .page-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      background: none;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--mid);
      cursor: pointer;
      transition: all 0.2s;
    }

    .page-btn:hover { border-color: var(--black); color: var(--black); }
    .page-btn.active { background: var(--black); color: var(--white); border-color: var(--black); }
    .page-btn:disabled { opacity: 0.3; cursor: default; }

    /* ========== FOOTER ========== */
    footer { background: var(--white); border-top: 1px solid var(--border); padding: 56px 48px 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .footer-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 48px; padding-bottom: 40px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .footer-logo { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 300; letter-spacing: 0.24em; color: var(--black); text-decoration: none; flex-shrink: 0; }
    .footer-cols { display: flex; gap: 56px; flex-wrap: wrap; }
    .footer-col h4 { font-size: 0.58rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--mid); margin-bottom: 16px; white-space: nowrap; }
    .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 11px; }
    .footer-col a { font-size: 0.75rem; color: var(--mid); text-decoration: none; transition: color 0.2s; }

    .footer-bottom { display: flex; justify-content: space-between; align-items: center; }

    .footer-ig:hover { color: var(--black); }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 1200px) {
      .product-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 800px) {

    @media (max-width: 900px) and (pointer: coarse) {

  <script>
  const SHOP_CATEGORIES = [
    { label: 'New Arrivals', slug: 'new-arrivals' },
    { label: 'Tops', slug: 'tops', sub: [
      { label: 'Shirts', slug: 'shirts' },
      { label: 'Knit', slug: 'knit' },
      { label: 'Cut &amp; Sew / Sweat', slug: 'cut-sew-sweat' },
    ]},
    { label: 'Bottoms', slug: 'bottoms', sub: [
      { label: 'Pants', slug: 'pants' },
      { label: 'Skirts', slug: 'skirts' },
    ]},
    { label: 'Outerwear', slug: 'outerwear', sub: [
      { label: 'Jackets', slug: 'jackets' },
      { label: 'Coats', slug: 'coats' },
    ]},
    { label: 'Dresses / Setup', slug: 'dresses-setup' },
    { label: 'Bags', slug: 'bags' },
    { label: 'Shoes', slug: 'shoes' },
    { label: 'Accessories', slug: 'accessories' },
    { label: 'Sale', slug: 'sale' },
  ];

  let _navCloseTimer = null;
  let _navCurrentType = null;

  function openNavOverlay(type) {
    clearTimeout(_navCloseTimer);
    const overlay = document.getElementById('collOverlay');
    const inner   = document.getElementById('collOverlayInner');
    if (_navCurrentType !== type) {
      _navCurrentType = type;
      // coll → COLLECTIONS_DATA、shop → PRODUCTS_DATA のシーズンで独立管理
      let seasonLinks = '';
      if (type === 'coll') {
        const items = typeof COLLECTIONS_DATA !== 'undefined'
          ? COLLECTIONS_DATA.filter(c => c.published) : [];
        seasonLinks = items.map(c =>
          `<a href="collection.html?season=${encodeURIComponent(c.season)}">${c.season}</a>`
        ).join('');
      } else {
        const seasons = typeof PRODUCTS_DATA !== 'undefined'
          ? [...new Set(PRODUCTS_DATA.filter(p => p.published !== false).map(p => p.season))].sort().reverse()
          : [];
        seasonLinks = seasons.map(s =>
          `<a href="shop.html?season=${encodeURIComponent(s)}">${s}</a>`
        ).join('');
      }

      if (type === 'coll') {
        inner.innerHTML = `
          <div class="nav-overlay-col">
            <p class="nav-overlay-heading">Season Look</p>
            ${seasonLinks}
          </div>`;
      } else {
        const catLinks = SHOP_CATEGORIES.map(cat => {
          let html = `<a href="shop.html?category=${cat.slug}">${cat.label}</a>`;
          if (cat.sub) cat.sub.forEach(sub => {
            html += `<a href="shop.html?category=${sub.slug}" class="nav-overlay-sub">${sub.label}</a>`;
          });
          return html;
        }).join('');

        inner.innerHTML = `
          <div class="nav-overlay-col">
            <p class="nav-overlay-heading">Season Look</p>
            ${seasonLinks}
          </div>
          <div class="nav-overlay-col">
            <p class="nav-overlay-heading">Category</p>
            ${catLinks}
          </div>`;
      }
    }
    overlay.classList.add('open');
    _nav.classList.add('overlay-open');
  }

  function scheduleCloseNavOverlay() {
    _navCloseTimer = setTimeout(() => {
      document.getElementById('collOverlay').classList.remove('open');
      _nav.classList.remove('overlay-open');
      _navCurrentType = null;
    }, 120);
  }

  document.getElementById('collOverlay').addEventListener('mouseenter', () => clearTimeout(_navCloseTimer));
  document.getElementById('collOverlay').addEventListener('mouseleave', scheduleCloseNavOverlay);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      document.getElementById('collOverlay').classList.remove('open');
      _nav.classList.remove('overlay-open');
      _navCurrentType = null;
    }
  });

  // nav scroll
  const _nav = document.getElementById('nav');
  let _lastScrollY = window.scrollY;
  let _lastScrollTime = Date.now();
  window.addEventListener('scroll', () => {
    const scrollY = window.scrollY;
    const now = Date.now();
    const dt = now - _lastScrollTime || 1;
    const velocity = (scrollY - _lastScrollY) / dt;
    _nav.classList.toggle('scrolled', scrollY > 40);
    if (scrollY <= 0) {
      _nav.classList.remove('nav-hidden');
    } else if (scrollY > _lastScrollY && scrollY > 80 && velocity > 0.8) {
      _nav.classList.add('nav-hidden');
      document.getElementById('collOverlay').classList.remove('open');
      _nav.classList.remove('overlay-open');
      _navCurrentType = null;
    } else if (scrollY < _lastScrollY && velocity < -2.4) {
      _nav.classList.remove('nav-hidden');
    }
    _lastScrollY = scrollY;
    _lastScrollTime = now;
  });

  function toggleMobileColl(e) {
    e.stopPropagation();
    const seasons = document.getElementById('mobileCollSeasons');
    const arrow   = document.getElementById('mobileCollArrow');
    const isOpen  = seasons.classList.contains('open');
    seasons.classList.toggle('open', !isOpen);
    arrow.classList.toggle('open', !isOpen);
    if (!isOpen && seasons.innerHTML === '' && typeof COLLECTIONS_DATA !== 'undefined') {
      seasons.innerHTML = COLLECTIONS_DATA.filter(c => c.published).map(c =>
        '<a href="collection.html?season=' + encodeURIComponent(c.season) + '">' + c.season + '</a>'
      ).join('');
    }
  }

  const hamburger = document.getElementById('hamburger');
  const mobileMenu = document.getElementById('mobileMenu');
  hamburger.addEventListener('click', () => {
    hamburger.classList.toggle('open');
    mobileMenu.classList.toggle('open');
    document.body.style.overflow = mobileMenu.classList.contains('open') ? 'hidden' : '';
  });
  document.querySelectorAll('.mobile-nav-link').forEach(link => {
    link.addEventListener('click', () => {
      hamburger.classList.remove('open');
      mobileMenu.classList.remove('open');
      document.body.style.overflow = '';
    });
  });
  </script>
  <script>
    // PRODUCTS_DATA は products-data.js から読み込み

    // ============================================================
    //  フィルター状態
    // ============================================================
    const state = {
      priceMin: 0,
      priceMax: Infinity,
      statuses: [],
      seasons: [],
      category: '',
      sort: 'newest',
    };

    // URLパラメーターでシーズン・カテゴリーを初期フィルター
    const _urlParams = new URLSearchParams(location.search);
    const _urlSeason   = _urlParams.get('season');
    const _urlCategory = _urlParams.get('category');
    const _isPreview   = _urlParams.get('preview') === '1';
    if (_urlCategory) {
      state.category = _urlCategory;
      // カテゴリーページではバナー非表示・上余白を開ける
      const banner = document.getElementById('seasonBanner');
      if (banner) banner.style.display = 'none';
      const area = document.querySelector('.product-area');
      if (area) area.style.paddingTop = '240px';
    }
    if (_urlSeason) {
      state.seasons = [_urlSeason];
    } else if (typeof COLLECTIONS_DATA !== 'undefined') {
      // シーズン未指定なら公開済みの最新シーズンを自動選択
      const latest = COLLECTIONS_DATA.find(c => c.published);
      if (latest) state.seasons = [latest.season];
    }

    // ============================================================
    //  レンダリング
    // ============================================================
    const PER_PAGE = 20;
    let currentPage = 1;

    function updateSeasonBanner() {
      const banner = document.getElementById('seasonBanner');
      if (!banner || typeof COLLECTIONS_DATA === 'undefined') return;

      // 表示するシーズンを決定（フィルター選択中ならそれ、なければ最初の published）
      const targetSeason = state.seasons.length === 1
        ? state.seasons[0]
        : (COLLECTIONS_DATA[0] || {}).season;

      const coll = COLLECTIONS_DATA.find(c => c.season === targetSeason);
      if (!coll || !coll.keyVisual) { banner.classList.remove('visible'); return; }

      const imgUrl = `${coll.folder}/${coll.keyVisual}`;
      banner.style.backgroundImage = `url('${imgUrl}')`;
      banner.classList.add('visible');
      // 画像が存在しない場合は非表示
      const img = new Image();
      img.onerror = () => { banner.classList.remove('visible'); banner.style.backgroundImage = ''; };
      img.src = imgUrl;
    }

    function render() {
      currentPage = 1;
      updateSeasonBanner();
      renderPage();
    }

    function renderPage() {
      let list = PRODUCTS_DATA.filter(p => {
        if (!_isPreview && p.published === false) return false;
        if (p.price < state.priceMin) return false;
        if (p.price > state.priceMax) return false;
        if (state.statuses.length > 0 && !state.statuses.includes(p.status)) return false;
        if (state.seasons.length  > 0 && !state.seasons.includes(p.season))  return false;
        if (state.category && !(p.categories || []).includes(state.category)) return false;
        return true;
      });

      switch (state.sort) {
        case 'newest':    list.sort((a,b) => b.date - a.date); break;
        case 'oldest':    list.sort((a,b) => a.date - b.date); break;
        case 'price-asc': list.sort((a,b) => a.price - b.price); break;
        case 'price-desc':list.sort((a,b) => b.price - a.price); break;
        case 'az':        list.sort((a,b) => nameFromFile(a.images[0]).localeCompare(nameFromFile(b.images[0]))); break;
        case 'za':        list.sort((a,b) => nameFromFile(b.images[0]).localeCompare(nameFromFile(a.images[0]))); break;
      }

      const totalPages = Math.ceil(list.length / PER_PAGE);
      if (currentPage > totalPages) currentPage = Math.max(1, totalPages);
      const pageList = list.slice((currentPage - 1) * PER_PAGE, currentPage * PER_PAGE);

      const grid = document.getElementById('productGrid');
      const pagEl = document.getElementById('pagination');

      if (list.length === 0) {
        grid.innerHTML = '<p class="no-results">該当する商品がありません</p>';
        pagEl.innerHTML = '';
      } else {
        const fallbackColors = ['#d8d8d8','#e2e2e2','#cccccc','#dcdcdc','#d0d0d0','#e6e6e6','#c8c8c8','#dadada','#e0e0e0','#d4d4d4','#cfcfcf','#e8e8e8'];
        grid.innerHTML = pageList.map((p, i) => {
          const mainImg  = `${p.folder}/${p.images[0]}`;
          const hoverImg = p.images[1] ? `${p.folder}/${p.images[1]}` : '';
          const bgStyle  = `background-image:url('${mainImg}');background-size:cover;background-position:center;background-color:${fallbackColors[i % fallbackColors.length]};`;
          return `
          <div class="product-card ${p.status === 'soldout' ? 'soldout' : ''}" onclick="window.location='product.html?id=${p.id}'" style="cursor:pointer">
            <div class="product-img" style="${bgStyle}" data-img-collapse>
              <div class="product-img-hover" style="background-image:url('${hoverImg}');background-size:cover;background-position:center;"></div>
              <div class="product-img-overlay"></div>
              ${p.status === 'bespoke'    ? '<span class="corner-badge badge-bespoke-tag">別注</span>' : ''}
              ${p.status === 'comingsoon' ? '<span class="corner-badge badge-comingsoon-tag">Coming Soon</span>' : ''}
              ${p.status === 'soldout'    ? '<div class="soldout-overlay"><span class="soldout-badge">SOLD OUT</span></div>' : ''}
            </div>
            <p class="product-name">${nameFromFile(p.images[0])}</p>
            <p class="product-price">¥${p.price.toLocaleString()}</p>
          </div>`;
        }).join('');

        // ページネーション
        if (totalPages > 1) {
          let btns = '';
          if (currentPage > 1) btns += `<button class="page-btn" onclick="goPage(${currentPage-1})">‹</button>`;
          for (let i = 1; i <= totalPages; i++) {
            btns += `<button class="page-btn${i===currentPage?' active':''}" onclick="goPage(${i})">${i}</button>`;
          }
          if (currentPage < totalPages) btns += `<button class="page-btn" onclick="goPage(${currentPage+1})">›</button>`;
          pagEl.innerHTML = btns;
        } else {
          pagEl.innerHTML = '';
        }
      }
      initImgCollapse();
    }

    function goPage(page) {
      currentPage = page;
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ============================================================
    //  初期化
    // ============================================================
    render();
  </script>
